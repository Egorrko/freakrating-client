# Сборки клиента в GitHub Releases по тегу: git tag v0.1.0 && git push origin v0.1.0
# Версия в package.json должна совпадать с тегом (проверяется ниже).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            files: |
              release/*.exe
          - os: ubuntu-latest
            script: dist:linux
            files: |
              release/*.AppImage
              release/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Версия совпадает с тегом
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          pkg=$(node -p "require('./package.json').version")
          [ "v$pkg" = "${GITHUB_REF_NAME}" ] || { echo "package.json $pkg, тег ${GITHUB_REF_NAME}"; exit 1; }

      # uiohook-napi берёт готовую N-API-сборку из prebuilds/, компилятор не нужен.
      - run: npm ci

      - run: npm test

      - run: npm run ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: freakrating-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

      - name: В релиз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
          draft: true
          generate_release_notes: true
